<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="490" viewBox="0 0 1200 490" role="img" aria-labelledby="title desc">
  <title id="title">One CLI, separate desktop state</title>
  <desc id="desc">Codex Profile Runtime launches personal and work ChatGPT Desktop profiles with separate Codex and Electron data directories.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101b30"/>
      <stop offset="1" stop-color="#080f1d"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#61d7dd"/>
      <stop offset="1" stop-color="#a8a1ff"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#5a7796" opacity=".15"/>
    </pattern>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity=".22"/>
    </filter>
  </defs>

  <rect width="1200" height="490" rx="24" fill="url(#background)"/>
  <rect width="1200" height="490" rx="24" fill="url(#dots)"/>
  <rect x="0" y="0" width="1200" height="5" rx="2.5" fill="url(#accent)"/>

  <text x="72" y="53" fill="#67d9df" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="700" letter-spacing="3">CODEX PROFILE RUNTIME</text>
  <text x="72" y="105" fill="#f0f5ff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="39" font-weight="700">One CLI. Separate desktop state.</text>
  <text x="73" y="139" fill="#aabbd1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17">Named profiles for ChatGPT Desktop on macOS</text>

  <rect x="503" y="160" width="194" height="44" rx="22" fill="#1d2c45" stroke="#5e7595"/>
  <circle cx="527" cy="182" r="7" fill="#76d8dc"/>
  <text x="545" y="189" fill="#f0f5ff" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="21" font-weight="700">cpr launch</text>
  <path d="M600 204v23 M327 227h546 M327 227v18 M873 227v18" fill="none" stroke="#6681a1" stroke-width="2" stroke-linecap="round"/>
  <circle cx="327" cy="245" r="4" fill="#6ed8dd"/>
  <circle cx="873" cy="245" r="4" fill="#ada5ff"/>

  <g filter="url(#shadow)">
    <rect x="72" y="258" width="510" height="172" rx="18" fill="#17243b" stroke="#3a6a79"/>
    <rect x="618" y="258" width="510" height="172" rx="18" fill="#17243b" stroke="#625d95"/>
  </g>

  <circle cx="98" cy="282" r="5" fill="#6ddadf"/>
  <circle cx="115" cy="282" r="5" fill="#355268"/>
  <circle cx="132" cy="282" r="5" fill="#355268"/>
  <text x="160" y="289" fill="#f0f5ff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22" font-weight="700">personal</text>
  <rect x="444" y="270" width="112" height="26" rx="13" fill="#1d424e"/>
  <text x="460" y="287" fill="#9de8e5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600">optional proxy</text>

  <circle cx="644" cy="282" r="5" fill="#aea6ff"/>
  <circle cx="661" cy="282" r="5" fill="#4b476f"/>
  <circle cx="678" cy="282" r="5" fill="#4b476f"/>
  <text x="706" y="289" fill="#f0f5ff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22" font-weight="700">work</text>
  <rect x="990" y="270" width="112" height="26" rx="13" fill="#343052"/>
  <text x="1006" y="287" fill="#c5beff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600">optional proxy</text>

  <rect x="92" y="311" width="470" height="42" rx="9" fill="#0e1a2d"/>
  <rect x="92" y="362" width="470" height="42" rx="9" fill="#0e1a2d"/>
  <rect x="638" y="311" width="470" height="42" rx="9" fill="#0e1a2d"/>
  <rect x="638" y="362" width="470" height="42" rx="9" fill="#0e1a2d"/>

  <text x="108" y="337" fill="#a6cbd4" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="15">CODEX_HOME</text>
  <text x="260" y="337" fill="#f0f5ff" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="15">personal/codex-home</text>
  <text x="108" y="388" fill="#a6cbd4" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="15">user-data-dir</text>
  <text x="260" y="388" fill="#f0f5ff" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="15">personal/chatgpt-user-data</text>

  <text x="654" y="337" fill="#bfb9e9" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="15">CODEX_HOME</text>
  <text x="806" y="337" fill="#f0f5ff" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="15">work/codex-home</text>
  <text x="654" y="388" fill="#bfb9e9" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="15">user-data-dir</text>
  <text x="806" y="388" fill="#f0f5ff" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="15">work/chatgpt-user-data</text>

  <text x="73" y="462" fill="#889bb5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14">App-state separation · shared macOS host · no automatic history or auth migration</text>
</svg>
